version: "3"

networks:
  radiusnet:
    external: false

services:
  radiusd:
    image: alexradius
    build:
      context: ./docker/radiusd
      dockerfile: Dockerfile
      args:
        - TZ
        - RADIUS_HOST
        - APKREPO_EDGE
        - NO_PREPARE
    environment:
      - RADIUS_IP
      - COUNTRYNAME
      - LOCALITYNAME
      - CA_LIFETIME
      - CRL_LIFETIME
      - HOST_CERT_LIFETIME
      - DEBUG
    restart: always
    networks:
      - radiusnet
    ports:
      - "${RADIUS_IP}:1812:1812/udp"
    entrypoint: [ "./start.sh" ]
    volumes:
      - ./backup:/backup
      - ./provision:/provision
      - raddb:/etc/raddb

volumes:
  raddb:
    driver: local
